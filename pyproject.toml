[project]
name = "cbm-eeg-bench"
version = "1.0.0"
description = "Benchmarking computational brain models as dimensionality reduction methods for EEG"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lorenz Heiler" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Core numerical & ML
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    # Deep learning
    "torch",
    # EEG processing
    "mne",
    "mne-bids",
    "autoreject",
    # Optimisation & feature extraction
    "cma",
    "pycatch22",
    "optuna",
    # Visualisation & reporting
    "matplotlib",
    "seaborn",
    "tabulate",
    # Parallel processing
    "joblib",
    "tqdm",
    "tqdm-joblib",
    # JIT for mechanistic model solvers (falls back to pure Python if absent)
    "numba",
    # Memory monitoring during evaluation
    "psutil",
    # Configuration
    "pyyaml",
]

[project.optional-dependencies]
# Only needed for latent_extraction/ctm_nn/amore/amortized_inference_post.py
posterior = [
    "sbi",
    "corner",
]

[tool.uv]
# The code is run as scripts from code/, not installed as a package.
package = false
